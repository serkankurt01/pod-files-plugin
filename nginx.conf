server {
    listen 9001 ssl;
    server_name _;
    root /usr/share/nginx/html;

    ssl_certificate     /etc/tls/private/tls.crt;
    ssl_certificate_key /etc/tls/private/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Plugin static assets — long cache
    location /pod-files-plugin/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri $uri/ =404;
    }

    # Plugin manifest must NOT be cached
    location = /pod-files-plugin/plugin-manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health check (HTTP probe — liveness/readiness use HTTP, not HTTPS)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
