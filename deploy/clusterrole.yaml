apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-files-plugin-viewer
rules:
  # Allows the console (on behalf of the logged-in user) to exec into pods.
  # The console already enforces its own RBAC; this role is for explicit audit.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-files-plugin-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-files-plugin-viewer
subjects:
  - kind: ServiceAccount
    name: default
    namespace: pod-files-plugin
